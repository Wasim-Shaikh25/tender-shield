name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Alembic up/down check (scratch DB)
        env:
          TS_DATABASE_URL: sqlite:///./_ci_scratch.db
        run: |
          alembic upgrade head
          alembic downgrade base

  backend-postgres:
    # RLS isolation cannot be exercised on SQLite (bind_workspace_context is a
    # documented no-op there — see app/core/db.py). This job is the only place
    # the R-001 §B / TS-086 isolation guarantee is actually checked, against a
    # real PostgreSQL server with FORCE ROW LEVEL SECURITY live.
    #
    # Two databases, deliberately: tendershield_migrate verifies the full
    # alembic chain (every module's tables/FKs) up/down cleanly; tendershield_rls
    # is shared by every `-m postgres` test file (RLS isolation, the
    # free-review race, gap-free GST invoice sequencing under concurrency) —
    # they build their own minimal schema via Base.metadata, which is a
    # process-wide singleton, so running them together is safe. Sharing
    # tendershield_rls with the full-migration database broke drop_all — the
    # migrated schema has FKs (findings, artifacts, baselines, ...) these
    # tests' models don't know about.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tendershield
          POSTGRES_PASSWORD: tendershield
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" "psycopg[binary]"
      - name: Create test databases
        run: |
          PGPASSWORD=tendershield psql -h localhost -U tendershield -d postgres -c "CREATE DATABASE tendershield_migrate"
          PGPASSWORD=tendershield psql -h localhost -U tendershield -d postgres -c "CREATE DATABASE tendershield_rls"
      - name: Migrate full schema (Postgres) — up then down
        env:
          TS_DATABASE_URL: postgresql+psycopg://tendershield:tendershield@localhost:5432/tendershield_migrate
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Postgres-only tests (RLS isolation, race-safety, GST sequencing)
        env:
          TS_TEST_DATABASE_URL: postgresql+psycopg://tendershield:tendershield@localhost:5432/tendershield_rls
        run: pytest -q -m postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
