[project]
name = "tendershield-backend"
version = "0.1.0"
description = "TenderShield AI backend — modular monolith of pluggable modules"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: these calls in argument defaults are intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "app.modules.auth.deps.require"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]  # Alembic column definitions read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
