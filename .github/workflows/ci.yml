name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,storage,redis]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Security audit
        run: |
          pip install --upgrade pip setuptools
          pip-audit --desc --local
      - name: Test
        run: pytest -q
      - name: Alembic up/down check (scratch DB)
        env:
          TS_DATABASE_URL: sqlite:///./_ci_scratch.db
        run: |
          alembic upgrade head
          alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
