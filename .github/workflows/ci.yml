name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,storage,redis,billing,scheduler,celery,auth]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Security audit
        run: |
          pip install --upgrade pip setuptools
          pip-audit --desc --local
      - name: Test
        run: pytest -q
      - name: Alembic up/down check (scratch DB)
        env:
          TS_DATABASE_URL: sqlite:///./_ci_scratch.db
        run: |
          alembic upgrade head
          alembic downgrade base

  rls-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tendershield
          POSTGRES_PASSWORD: tendershield
          POSTGRES_DB: tendershield
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: tendershield
      PGPASSWORD: tendershield
      PGHOST: localhost
      PGDATABASE: tendershield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev,storage,redis,billing,scheduler,celery,auth]"
          pip install psycopg[binary]
      - name: Create least-privilege role and database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          psql -c "CREATE USER app WITH PASSWORD 'app' NOSUPERUSER;"
          psql -c "CREATE DATABASE app_db OWNER app;"
      - name: Migrate
        env:
          TS_DATABASE_URL: postgresql+psycopg://app:app@localhost/app_db
        run: alembic upgrade head
      - name: RLS tests
        env:
          TS_DATABASE_URL: postgresql+psycopg://app:app@localhost/app_db
        run: pytest tests/test_rls_postgres.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
