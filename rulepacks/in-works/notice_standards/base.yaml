# Universal notice-standard (scope: universal).
#
# The contract-form-agnostic baseline of notice regimes a well-formed
# construction contract is expected to carry. Regional packs (india.yaml,
# future gcc.yaml/uk.yaml) and per-org custom standards OVERRIDE these by
# `key`. Data only; adding a market is a new YAML file, not code.
#
# Day-counts are drawn from published standard-form clause structures (see
# references.md). They VARY by contract edition and particular conditions, so
# every category was confidence: unvalidated until the TS-P02 launch sign-off.
# (Doc §2.4, §14). They are a checklist prompt, never legal advice.
id: notice_base
scope: universal
confidence: validated
source: >
  FIDIC Red Book 1999 cl.20.1 & 2017 cl.20.2; NEC4 ECC cl.61.3; JCT SBC/Q 2016
  EOT/loss-and-expense provisions — published clause structures (see
  references.md). Accepted for launch under TS-P02 sign-off.
categories:
  - key: claim
    label: Contractor's claim / time-bar
    typical_days: 28
    expected: true
    keywords: [claim, entitlement, time-barred, notify, notice of claim]
    note: >
      FIDIC 2017 cl.20.2: Notice within 28 days of awareness, fully-detailed
      claim within 84 days — a condition precedent (missing it bars the claim).
  - key: variation
    label: Variation / change instruction
    typical_days: 14
    expected: true
    keywords: [variation, change order, instruction, extra work, deviation]
    note: Confirmation/response window; varies widely by form.
  - key: extension_of_time
    label: Extension of time (EOT)
    typical_days: 28
    expected: true
    keywords: [extension of time, EOT, delay, prolongation, completion date]
    note: FIDIC ties EOT to the 28-day claim notice; JCT requires notice "forthwith".
  - key: compensation_event
    label: Compensation event (NEC)
    typical_days: 56
    expected: false
    keywords: [compensation event, CE, project manager, early warning]
    note: NEC4 cl.61.3 — notify within 8 weeks (56 days) or lose entitlement.
  - key: payment
    label: Payment / interim application
    typical_days: 14
    expected: true
    keywords: [payment, interim, invoice, running account, RA bill, certificate]
    note: Interim-application cadence; statutory regimes (below) can override.
  - key: defect
    label: Defect / rectification notice
    typical_days: 14
    expected: false
    keywords: [defect, rectification, making good, snag, latent defect]
  - key: termination
    label: Termination / cure notice
    typical_days: 14
    expected: true
    keywords: [terminate, termination, cure, breach, default notice]
  - key: dispute
    label: Dispute / dissatisfaction notice
    typical_days: 28
    expected: false
    keywords: [dispute, arbitration, adjudication, notice of dissatisfaction, DAAB]
    note: FIDIC notice of dissatisfaction with a DAAB decision — 28 days.
