# Local Postgres + Redis + MinIO + observability (Jaeger/Grafana) stack. This is
# the closest local mirror of production without cloud credentials.
#
#   cp .env.dev .env.local
#   docker compose --env-file .env.local up --build
#
# To also start Jaeger and Grafana:
#   docker compose --env-file .env.local --profile observability up --build
#
# Default credentials:
#   Postgres  postgres://tendershield:tendershield@localhost:5432/tendershield
#   Redis     redis://localhost:6379/0
#   MinIO     http://localhost:9000  (minio / minio123)
#   MinIO console http://localhost:9001
#   Jaeger UI http://localhost:16686
#   Grafana   http://localhost:3100  (admin / admin)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tendershield
      POSTGRES_PASSWORD: tendershield
      POSTGRES_DB: tendershield
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tendershield"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: [.env.dev]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes: ["backend_storage:/app/storage"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on: [backend]
    ports: ["3000:3000"]

  # Self-hosted observability stack (option 1). Enable with --profile observability.
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    depends_on: [jaeger]
    ports:
      - "3100:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  redisdata:
  miniodata:
  backend_storage:
  grafanadata:
