[project]
name = "tendershield-office-mcp"
version = "0.1.0"
description = "MCP server for QS engineers to read/write Microsoft Word and Excel tender documents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.14,<2.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tendershield_office_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
