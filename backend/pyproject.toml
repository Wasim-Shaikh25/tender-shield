[project]
name = "tendershield-backend"
version = "0.1.0"
description = "TenderShield AI backend — modular monolith of pluggable modules"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.0",
    "duckdb>=1.0",
    "argon2-cffi>=23.1",
    "PyJWT[crypto]>=2.8",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "python-multipart>=0.0.9",
    "pyotp>=2.9",
    "pdfplumber>=0.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "uvicorn>=0.30",
]
# OCR for scanned/image PDFs — offline, no cloud (ONNX models bundled).
# Enable with TS_OCR_ENABLED=true after `pip install -e ".[ocr]"`.
ocr = [
    "rapidocr-onnxruntime>=1.3",
    "pymupdf>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: these calls in argument defaults are intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.File", "app.core.deps.require"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]  # Alembic column definitions read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
