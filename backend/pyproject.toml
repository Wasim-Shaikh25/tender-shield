[project]
name = "tendershield-backend"
version = "0.1.0"
description = "TenderShield AI backend — modular monolith of pluggable modules"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.0",
    "duckdb>=1.0",
    "argon2-cffi>=23.1",
    "PyJWT[crypto]>=2.8",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "python-multipart>=0.0.9",
    "pyotp>=2.9",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "filetype>=1.2",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "uvicorn>=0.30",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "psycopg[binary]>=3.1",
]
# OCR for scanned/image PDFs — offline, no cloud (ONNX models bundled).
# Enable with TS_OCR_ENABLED=true after `pip install -e ".[ocr]"`.
ocr = [
    "rapidocr-onnxruntime>=1.3",
    "pymupdf>=1.24",
]
# S3 storage and Redis rate limiting / task broker.
storage = ["boto3>=1.34"]
redis = ["redis[hiredis]>=5.0,<6.5"]
# Payment-provider SDKs (credential-gated; imported lazily).
billing = ["razorpay>=1.50", "stripe>=8.0"]
# Async job scheduler for deadline alerts and recurring digests.
scheduler = ["APScheduler>=3.10"]
# Async task worker + broker; falls back to eager execution without Redis.
celery = ["celery[redis]>=5.4", "redis[hiredis]>=5.0,<6.5"]
# OIDC providers (credential-gated; imported lazily).
auth = ["google-auth>=2.32"]
# Observability: Sentry error tracking (metrics are built-in and exposed at /api/health/metrics).
observability = ["sentry-sdk[fastapi]>=2.0,<3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: these calls in argument defaults are intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.File", "app.core.deps.require"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]  # Alembic column definitions read better unwrapped

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["attr-defined", "arg-type", "union-attr", "valid-type", "operator", "index", "assignment", "name-defined", "annotation-unchecked"]

[tool.pytest.ini_options]
testpaths = ["tests"]
